
name: Build AcrilicNotepad

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build DLL
        shell: cmd
        run: cl /nologo /EHsc /std:c++17 AcrilicNotepadLauncher.cpp user32.lib /link /OUT:AcrilicNotepadLauncher.exe

      - name: Build launcher
        shell: cmd
        run: cl /nologo /EHsc /std:c++17 AcrilicNotepadLauncher.cpp /link /OUT:AcrilicNotepadLauncher.exe

      - name: Upload compiled files
        uses: actions/upload-artifact@v4
        with:
          name: AcrilicNotepad-build
          path: |
            AcrilicNotepad.dll
            AcrilicNotepadLauncher.exe
